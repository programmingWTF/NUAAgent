name: 功能请求
description: 为这个项目提一个想法
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出功能建议！
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 这个功能要解决什么问题？痛点是什么？
      placeholder: 让人困扰的是……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述你希望看到的行为。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你尝试过的替代方法或变通方案。
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 改动规模
      description: 这次改动有多大？
      options:
        - 小（类似 bug 修复，&lt; 100 行）
        - 中（新模块，约 100-500 行）
        - 大（架构级改动）
      default: 0
    validations:
      required: true
