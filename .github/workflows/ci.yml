name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 启用 Corepack（pnpm）
        run: corepack enable

      - name: 安装依赖
        run: npm run setup

      - name: 构建
        run: npm run build

      - name: 单元测试
        # test:ci = vitest run 排除需企业 runner 环境的环境类测试（workflow worker/ACP 快照/
        # sandbox/typert 远程模型/真实产品二进制等，见 dsh/package.json 的 test:ci 定义）。
        # 上游在自建企业 runner 跑全量（pnpm test）；公共 runner 下这些测试无法满足运行环境。
        run: corepack pnpm -C dsh test:ci
